name: EAS Preview Update

# Disabled on pull_request until EXPO_TOKEN secret is configured (OPS-001 territory).
# Re-enable by adding the secret in repo settings and changing trigger to:
#   on:
#     pull_request:
#       paths:
#         - 'apps/mobile/**'
#         - 'packages/core/**'
on:
  workflow_dispatch:

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish EAS Update to preview channel
        working-directory: apps/mobile
        run: eas update --branch preview --message "PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}"
